# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# OpenCode Go is fronted by exactly ONE provider route: the `dsh-opencode-go`
# plugin (shown as "DSH OpenCode Go"). The gateway serves three protocols on one
# base URL -- /chat/completions, /responses, /messages -- and a model answers
# only on its own; calling the wrong endpoint fails with HTTP 400/503 "Model
# does not support this protocol." The plugin reads the gateway's live listing
# and takes each model's protocol from models.dev, so it routes all 36 ids to
# the right endpoint without a hand-declared route per protocol. Earlier
# revisions declared `opencode-go`, `opencode-go-responses` and
# `opencode-go-messages` by hand on the `llm-pi-ai` plugin. The plugin
# supersedes all three, so they were removed and the picker now shows a single
# OpenCode Go provider instead of four.
#
# The `llm.cost` table below exists because the plugin's adapter reports no
# rate, and `llm.cost` is the documented home for "list prices for routes whose
# adapter reports none" -- a stated rate also wins over the adapter's own.
# Values are models.dev's published USD-per-million for this gateway. Only the
# base band is expressible here: the schema models time-of-day peak windows,
# not the token-threshold tiers models.dev publishes for Claude, so a very
# large Claude request is estimated at the base band.

- id: llm
  name: "@deepseek-ai/dsh-llm"
  config:
    cost:
      dsh-opencode-go:
        claude-haiku-5-5: { input: 0.1, output: 0.5, cacheRead: 0.01, cacheWrite: 0.125 }
        deepseek-v4-flash: { input: 0.15, output: 0.6, cacheRead: 0.003 }
        deepseek-v4-flash-vision-exp: { input: 0.15, output: 0.6, cacheRead: 0.003 }
        deepseek-v4-pro: { input: 0.66, output: 1.98, cacheRead: 0.022 }
        deepseek-v4.1-flash: { input: 0.15, output: 0.6, cacheRead: 0.003 }
        glm-5.2: { input: 1.4, output: 4.4, cacheRead: 0.26 }
        glm-5.3: { input: 1.4, output: 4.4, cacheRead: 0.26 }
        glm-5.3-flash: { input: 0.15, output: 0.5, cacheRead: 0.03 }
        gpt-5.6-luna: { input: 0.2, output: 1.2, cacheRead: 0.02, cacheWrite: 0.25 }
        gpt-6-luna: { input: 0.1, output: 0.5, cacheRead: 0.01, cacheWrite: 0.125 }
        grok-4.5: { input: 2, output: 6, cacheRead: 0.3 }
        grok-4.6: { input: 2, output: 6, cacheRead: 0.5 }
        grok-4.7: { input: 2, output: 6, cacheRead: 0.5 }
        hy3: { input: 0.14, output: 0.58, cacheRead: 0.035 }
        hy4-preview: { input: 0.834, output: 2.501, cacheRead: 0.042 }
        kimi-k2.6: { input: 0.95, output: 4, cacheRead: 0.16 }
        kimi-k2.7-code: { input: 0.95, output: 4, cacheRead: 0.19 }
        kimi-k3: { input: 3, output: 15, cacheRead: 0.3 }
        longcat-2.0: { input: 0.3, output: 1.2, cacheRead: 0.006 }
        longcat-2.5-preview-free: { input: 0, output: 0, cacheRead: 0 }
        mimo-v2.5: { input: 0.14, output: 0.28, cacheRead: 0.0028 }
        mimo-v2.5-pro: { input: 0.435, output: 0.87, cacheRead: 0.003625 }
        mimo-v2.6-flash: { input: 0.14, output: 0.28, cacheRead: 0.0028 }
        mimo-v2.6-pro: { input: 0.435, output: 0.87, cacheRead: 0.003625 }
        minimax-m2.7: { input: 0.3, output: 1.2, cacheRead: 0.06, cacheWrite: 0.375 }
        minimax-m3: { input: 0.3, output: 1.2, cacheRead: 0.06 }
        muse-spark-1.2-contributor: { input: 0.1, output: 0.2, cacheRead: 0.002 }
        muse-spark-1.3-contributor: { input: 0.1, output: 0.2, cacheRead: 0.002 }
        qwen3.6-plus: { input: 0.5, output: 3, cacheRead: 0.05, cacheWrite: 0.625 }
        qwen3.7-max: { input: 2.5, output: 7.5, cacheRead: 0.5, cacheWrite: 3.125 }
        qwen3.7-plus: { input: 0.4, output: 1.6, cacheRead: 0.04, cacheWrite: 0.5 }
        qwen3.8-flash: { input: 0.15, output: 0.47, cacheRead: 0.016, cacheWrite: 0.2 }
        qwen3.8-max: { input: 2, output: 6, cacheRead: 0.25, cacheWrite: 2.5 }
        space-bunny: { input: 0.15, output: 0.6, cacheRead: 0.03, cacheWrite: 0 }
        space-bunny-free: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        step-5-preview-free: { input: 0, output: 0, cacheRead: 0 }

# Dedicated OpenCode Go adapter (provider id `dsh-opencode-go`, shown as
# "DSH OpenCode Go"). It discovers the gateway listing and takes each model's
# protocol from models.dev, so new ids — Claude included — need no hand
# declaration. It defaults to OPENCODE_API_KEY, which this deployment does not
# set; point it at the key the .env already carries.
- id: opencode-go
  name: dsh-opencode-go
  config:
    apiKeyEnv: OPENCODE_GO_API_KEY

# The base bundles also mount a first-party DeepSeek route:
# `llm-deepseek-api-key` owns provider `deepseek-official`, shown as "DeepSeek".
# It defaults its catalog to DEFAULT_MODELS, so it advertises
# "DeepSeek-V41-Flash" (`deepseek-flash`) and "DeepSeek-V4-Pro" right beside the
# gateway's near-identically named `deepseek-v4.1-flash` and `deepseek-v4-pro`
# -- and `deepseek-v4-pro` is the same id in both groups, so one of the two
# answers 401 while looking identical in the picker.
#
# That group cannot authenticate on this deployment. It sends
# `x-api-key: $DEEPSEEK_API_KEY` to https://api.deepseek.com/anthropic, and the
# value stored under that name is the opencode gateway key (oc_sk_...), which
# DeepSeek rejects:
#   401 Authentication Fails, Your api key: ****CflA is invalid
# An empty catalog removes the group from the picker, because the catalog keeps
# only groups that advertise at least one model. The plugin stays mounted, so
# the route returns with one edit once a real DeepSeek key is stored.
#
# `llm-deepseek-account` needs no entry here: with no signed-in DeepSeek account
# it already advertises an empty catalog by itself and is filtered out.
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models: []

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: dsh-opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: high

# ── per-user Session and Workspace scoping ─────────────────────────────────
# One harness, several people. Each identity sees only the Sessions and
# Workspaces beneath the root it owns; the owner sees everything.
#
# The three existing accounts are mapped explicitly rather than left to
# provisioning, because their directories predate this feature and the minted
# slug would not match: `Sunn@` would mint /root/sunn (the directory is
# /root/sunny) and `Aji@` would mint /root/aji (the directory is /root/ajit).
# Anyone else at the domain is minted /root/<local-part> on first load.
#
# requireIdentity is on: Caddy's strict_auth injects the real
# X-Auth-Request-Email with copy_headers, so every admitted request names its
# account and a request arriving without one is refused rather than treated as
# the operator. That also closes the direct-to-192.168.1.203:3080 path, which
# bypasses the edge entirely.
#
# Skills are not scoped. They live under $DSH_HOME/skills, outside every user
# root, so everyone sees the same catalog.
- id: session-scope
  config:
    header: x-auth-request-email
    admin:
      - main.pastrami903@passfwd.com
    users:
      "punit@rubysteels.com": /root/punit
      "sunn@rubysteels.com": /root/sunny
      "aji@rubysteels.com": /root/ajit
    provisionRoot: /root
    requireIdentity: true
